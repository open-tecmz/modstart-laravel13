<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="t4 d4">
  <title id="t4">写一个模块</title>
  <desc id="d4">章节标示：以新闻管理为例，从 config.json 声明、迁移、模型、控制器到后台菜单，一次跑通 CRUD。</desc>
  <rect width="1200" height="132" fill="#FFFFFF"/>
  <g id="motif">
    <rect x="56" y="30" width="14" height="14" rx="3" fill="#F0F0FE" stroke="#656DE6" stroke-width="1.4"/>
    <rect x="62" y="29" width="2" height="3" fill="#FFFFFF"/>
  </g>
  <text x="82" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, 'Noto Sans Mono', monospace" font-size="17" font-weight="600" letter-spacing="2" fill="#656DE6">05 / MODULE DEVELOPMENT</text>
  <text x="56" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#101828">从空目录到后台 CRUD</text>
  <text x="1144" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, 'Noto Sans Mono', monospace" font-size="17" fill="#667085">config.json → Migrate → Model → View</text>
  <line x1="56" y1="120" x2="1144" y2="120" stroke="#EAECF0" stroke-width="1.5"/>
</svg>
